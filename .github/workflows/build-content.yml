# Rebuilds the generated pages when content/ changes (e.g. edits made in Pages CMS
# or on github.com), then commits them. Vercel deploys that commit as usual.
name: Build content pages
on:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/build.mjs', 'assets/**']
permissions:
  contents: write
concurrency: { group: build-content, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.mjs
      - name: Commit generated pages
        run: |
          git config user.name "asksarah-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html skills.html skills stack.html stack things-ai-can-do.html things-ai-can-do shortcuts.html systems.html edit.html search.html search-index.json sitemap.xml
          git diff --cached --quiet || git commit -m "Rebuild pages from content"
          git push
